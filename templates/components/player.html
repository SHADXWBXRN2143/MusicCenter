{% from "components/macros.html" import icon %}
<div class="player" id="player-bar">

    <div class="player-track" id="player-track-trigger" title="Развернуть">
        <div class="player-cover-wrap">
            <img id="player-cover" class="player-cover" src="" alt="" hidden>
            <div class="player-cover-placeholder" id="player-cover-placeholder">{{ icon('note') }}</div>
        </div>
        <div class="player-meta">
            <div class="player-title" id="player-title">Ничего не играет</div>
            <div class="player-artist" id="player-artist">Выберите трек</div>
        </div>
    </div>

    <div class="player-center">
        <div class="player-buttons">
            <button id="shuffle-button" class="icon-btn" title="Перемешать">{{ icon('shuffle') }}</button>
            <button id="previous-button" class="icon-btn" title="Предыдущий трек">{{ icon('prev') }}</button>
            <button id="play-button" class="play-btn" title="Играть / пауза">
                <svg class="icon"><use id="play-icon-use" href="/static/icons/sprite.svg#play"></use></svg>
            </button>
            <button id="next-button" class="icon-btn" title="Следующий трек">{{ icon('next') }}</button>
            <button id="repeat-button" class="icon-btn" title="Повтор">
                <svg class="icon"><use id="repeat-icon-use" href="/static/icons/sprite.svg#repeat"></use></svg>
            </button>
        </div>
        <div class="player-progress">
            <span class="time" id="current-time">0:00</span>
            <div class="progress-bar" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
                <div class="progress-handle" id="progress-handle"></div>
            </div>
            <span class="time" id="total-time">0:00</span>
        </div>
    </div>

    <div class="player-extra">
        <button id="queue-button" class="icon-btn" title="Очередь">{{ icon('queue') }}</button>
        <span class="volume-icon">{{ icon('volume') }}</span>
        <input type="range" id="volume-slider" min="0" max="100" value="70">
    </div>

</div>

<div class="player-banner" id="player-banner" hidden>
    mpv не найден на этом устройстве — установите его (<code>sudo apt install mpv</code>), чтобы звук воспроизводился на музыкальном центре.
</div>

<div class="queue-panel" id="queue-panel" hidden>
    <h3>Очередь</h3>
    <div id="queue-list"></div>
</div>
