{% from "components/macros.html" import icon %}
<div class="now-playing-view" id="now-playing-view" hidden>

    <div class="np-header">
        <button class="icon-btn" id="np-close" title="Свернуть">{{ icon('chevron-down') }}</button>
        <div class="np-header-title">Сейчас играет</div>
        <div class="np-header-spacer"></div>
    </div>

    <div class="np-cover-wrap">
        <img id="np-cover" class="np-cover" src="" alt="" hidden>
        <div class="np-cover-placeholder" id="np-cover-placeholder">{{ icon('note') }}</div>
    </div>

    <div class="np-meta">
        <div class="np-title" id="np-title">Ничего не играет</div>
        <div class="np-artist" id="np-artist">Выберите трек</div>
    </div>

    <div class="waveform paused" id="np-waveform" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="np-slot" id="np-slot"></div>

    <div class="np-modes">
        <button id="radio-button" class="icon-btn" title="Radio: продолжать похожими треками">{{ icon('radio') }} Radio</button>
        <button id="sleep-button" class="icon-btn" title="Таймер сна">{{ icon('moon') }} <span id="sleep-label">Сон</span></button>
    </div>

</div>
