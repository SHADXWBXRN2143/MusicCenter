{% from "components/macros.html" import icon %}
<header class="topbar">

    <div class="page-title">{{ page_title or 'Главная' }}</div>

    <form class="search-box" action="/search" method="GET" role="search">
        <input
            type="text"
            id="global-search"
            name="q"
            placeholder="Что будем слушать?"
            autocomplete="off"
        >
    </form>

    <div class="status">{{ icon('dot') }} Онлайн</div>

</header>
