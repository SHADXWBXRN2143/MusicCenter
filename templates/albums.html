{% extends "base.html" %}
{% from "components/macros.html" import album_card %}

{% block content %}

<div class="section">
    <div class="section-header">
        <h2>Все альбомы</h2>
    </div>

    {% if albums %}
    <div class="grid">
        {% for album in albums %}
        {{ album_card(album) }}
        {% endfor %}
    </div>
    {% else %}
    <div class="empty-state">
        <h2>Альбомы не найдены</h2>
        <p>Проверьте подключение к Airsonic в config.py.</p>
    </div>
    {% endif %}
</div>

{% endblock %}
