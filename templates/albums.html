{% extends "base.html" %}
{% from "components/macros.html" import album_card %}

{% block content %}

<div class="section">
    <div class="section-header">
        <h2>Все альбомы</h2>
        <select class="sort-select" id="album-sort" onchange="location.href='/albums?sort='+this.value">
            {% for value, label in sort_options.items() %}
            <option value="{{ value }}" {{ 'selected' if value == sort else '' }}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    {% if albums %}
    <div class="grid">
        {% for album in albums %}
        {{ album_card(album) }}
        {% endfor %}
    </div>
    {% else %}
    <div class="empty-state">
        <h2>Альбомы не найдены</h2>
        <p>Проверьте подключение к Airsonic в config.py.</p>
    </div>
    {% endif %}
</div>

{% endblock %}
